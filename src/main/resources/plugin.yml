name: PlayerMenu
version: '1.0.0'
main: com.seasea.playermenu.PlayerMenuPlugin
api-version: '1.21'
author: seasea
description: OP専用の管理ダイアログを開くプラグイン

commands:
  playermenu:
    description: PlayerMenuを開く
    aliases: [pmenu]
    permission: playermenu.use
    usage: /playermenu

permissions:
  playermenu.use:
    description: PlayerMenuを開ける権限
    default: op
